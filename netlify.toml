[build]
  command = "npm run build"
  publish = "dist/training/browser"
[build.environment]
  NODE_VERSION = "22.22.3"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
